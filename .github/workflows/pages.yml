name: Deploy Web Publica Nova

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public site structure and links
        run: python3 scripts/validate_site.py
      - name: Scan public files for accidental secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|DROPBOX_REFRESH_TOKEN|SUPABASE_SERVICE_ROLE_KEY|NOVA_SQLITE_ENCRYPTION_KEY' --include='*.html' --include='*.js' --include='*.css' --include='*.json' .; then
            echo "Potential secret detected in public web files"
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify all public routes over HTTPS
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          routes=("" "nova-apps/" "nova-ecommerce/" "nova-bank/" "nova-novels/" "nova-nexus/" "noticias-nova/" "nova-chat/" "multimedia-nova/" "nova-ia/")
          for route in "${routes[@]}"; do
            url="${PAGES_URL}${route}"
            success=0
            for attempt in {1..10}; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o /tmp/nova-page.html && grep -qi "<title>" /tmp/nova-page.html; then
                success=1
                break
              fi
              sleep 5
            done
            if [[ "$success" -ne 1 ]]; then
              echo "Public route failed HTTP/content verification: $url"
              exit 1
            fi
            echo "Verified: $url"
          done
